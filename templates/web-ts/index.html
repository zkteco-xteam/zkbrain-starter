<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZKBrain Web 脑机监控仪表盘</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .btn:hover { background: #2563eb; }
    .metric { display: flex; justify-content: space-between; margin: 12px 0; font-size: 18px; }
    .bar { height: 12px; border-radius: 6px; background: #334155; overflow: hidden; margin-top: 6px; }
    .progress { height: 100%; width: 0%; transition: width 0.3s; }
    #waveCanvas { width: 100%; height: 160px; background: #090d16; border-radius: 8px; display: block; }
  </style>
</head>
<body>
  <div style="max-width: 800px; margin: 0 auto;">
    <h1>🧠 ZKBrain Web 脑机交互控制台</h1>

    <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <div style="font-size: 20px; font-weight: bold;" id="statusText">未连接脑电设备</div>
        <div style="color: #94a3b8; font-size: 14px; margin-top: 4px;">基于 W3C Web Bluetooth API</div>
      </div>
      <button class="btn" id="connectBtn">⚡ 扫描并连接设备</button>
    </div>

    <div class="card">
      <h2>实时脑波指标 (1Hz)</h2>
      <div class="metric">
        <span>专注度 (Attention):</span>
        <span id="attentionVal" style="color: #60a5fa; font-weight: bold;">0 / 100</span>
      </div>
      <div class="bar"><div id="attentionBar" class="progress" style="background: #3b82f6;"></div></div>

      <div class="metric" style="margin-top: 20px;">
        <span>放松度 (Meditation):</span>
        <span id="meditationVal" style="color: #4ade80; font-weight: bold;">0 / 100</span>
      </div>
      <div class="bar"><div id="meditationBar" class="progress" style="background: #22c55e;"></div></div>

      <div class="metric" style="margin-top: 20px; font-size: 15px; color: #94a3b8;">
        <span>电极接触状态:</span>
        <span id="contactStatus">未知</span>
      </div>
    </div>

    <div class="card">
      <h2>512Hz 原始脑电波形 (Raw EEG)</h2>
      <canvas id="waveCanvas" width="800" height="160"></canvas>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
