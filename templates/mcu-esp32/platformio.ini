; PlatformIO Project Configuration File
; Project: ZKBrain Embedded BCI Controller
; Maintainer: ZKTeco Brain-Computer Interface Division

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    Wire
    SPI

; -----------------------------------------------------------------------------
; Classic ESP32 DevKit (ESP32-WROOM-32 / NodeMCU-32S)
; -----------------------------------------------------------------------------
[env:esp32dev]
board = esp32dev
build_flags =
    -D CORE_DEBUG_LEVEL=0
    ; To use precompiled static library instead of compiling lib/ZKBrain source:
    ; -L precompiled/esp32 -lzkbrain_esp32_lx6

; -----------------------------------------------------------------------------
; ESP32-S3 DevKit (Dual-core Xtensa LX7 with Vector Extensions)
; -----------------------------------------------------------------------------
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; To use precompiled static library instead of compiling lib/ZKBrain source:
    ; -L precompiled/esp32s3 -lzkbrain_esp32_s3

; -----------------------------------------------------------------------------
; ESP32-C3 DevKit (Single-core RISC-V Compact IoT Node)
; -----------------------------------------------------------------------------
[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; To use precompiled static library instead of compiling lib/ZKBrain source:
    ; -L precompiled/esp32c3 -lzkbrain_esp32_c3
